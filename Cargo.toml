[package]
name = "tixschema"
version = "0.1.0"
edition = "2024"
description = "TixSchema: Procedural macros for generating TypeScript types and Zod v4 schemas from Rust structs and enums, with MongoDB ObjectId support"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tixena/tixena"
categories = ["development-tools::procedural-macros"]
keywords = ["macros", "proc-macro", "typescript", "zod", "codegen", "tixschema"]

[lib]
proc-macro = true

[dependencies]
syn = { version = ">=3", features = ["full", "parsing", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
log = "0.4"
regex = ">=1.10"
# The parser `regex::Regex::new` itself is built on. The `pattern` guard reads its AST to tell a
# construct only the `regex` crate can read from one a JavaScript regex literal carries too, which
# no second grammar written here could do without drifting from the one that actually applies. The
# requirement is capped below `0.9` on purpose: the AST is matched exhaustively, so a grammar that
# grows a construct has to be classified rather than silently waved through.
regex-syntax = "0.8"

[dev-dependencies]
mongodb = ">=3.7"
# Test-only: `rc` supplies serde's `Rc`/`Arc` impls, without which the wire criterion the
# transparent-wrapper coverage rests on cannot be read off an `Rc`/`Arc` field at all.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
chrono = { version = ">=0.4.40", features = ["serde"] }
regex = ">=1.10"
# Test-only: `span-locations` makes `Span::source_text()` work outside a real macro expansion,
# which is how the unit tests assert that generated tokens are spanned on the user's source.
proc-macro2 = { version = "1", features = ["span-locations"] }
# A dispatcher records a handler that came apart through `tracing::error!`, so the crate that
# invokes a transport's dispatcher macro names `tracing` in its own manifest, beside `serde` and
# `serde_json`. Here it is a dev-dependency for the same reason those two are: the tests invoke it.
tracing = "0.1"

# Transitive dep floors — pinned to fix known vulnerabilities:
# - bytes >=1.11.1: RUSTSEC-2026-0007 (integer overflow in BytesMut::reserve)
# - time >=0.3.47: RUSTSEC-2026-0009 (DoS via stack exhaustion)
bytes = ">=1.11.1"
time = ">=0.3.47"


[features]
default = ["serde", "zod", "jsonschema", "typescript"]

# Core features
serde = [] # Serde integration for attribute parsing and field renaming
zod = [] # Zod schema generation alongside TypeScript types
jsonschema = [] # JSON schema generation methods
object_id = [] # MongoDB ObjectId type support
typescript = [] # TypeScript type generation and TypeScript-style Zod schemas
chrono = [
] # Chrono date/time type support (NaiveDate, NaiveTime, NaiveDateTime, DateTime)

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Default trait methods (Drop::pin_drop, serde Visitor's private hooks) cannot be implemented.
missing_trait_methods = "allow"
blanket_clippy_restriction_lints = "allow"
implicit_return = "allow"
pub_with_shorthand = "allow"
module_name_repetitions = "allow"
question_mark_used = "allow"
self_named_module_files = "allow"
separated_literal_suffix = "allow"
single_call_fn = "allow"
print_stderr = "allow"
# Parser and low-level operations require byte indexing and arithmetic.
indexing_slicing = "allow"
arithmetic_side_effects = "allow"
string_slice = "allow"
# Write to String is infallible; discarding the result is intentional.
let_underscore_must_use = "allow"
# Private implementation details do not need doc comments on every field.
missing_docs_in_private_items = "allow"
# Inline annotations are a micro-optimization applied selectively, not globally.
missing_inline_in_public_items = "allow"
# as_conversions are used sparingly and safely for numeric casts.
as_conversions = "allow"
# Tests use unwrap() and expect() for concise assertions.
unwrap_used = "allow"
# Pattern matching through references is idiomatic in filter_map closures.
pattern_type_mismatch = "allow"
# Single-char identifiers are fine in tight scopes (loop vars, closures).
min_ident_chars = "allow"
# Test function naming is clearer with descriptive names, not enforced prefix rules.
redundant_test_prefix = "allow"
# Integer division is used safely for threshold calculations and tests.
integer_division = "allow"
integer_division_remainder_used = "allow"
# HashSet parameters use the default hasher; generalization adds complexity for no benefit.
implicit_hasher = "allow"
